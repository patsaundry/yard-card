<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Yard Card · Might and Power Club</title>
  <meta name="theme-color" content="#14110d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --soil: #14110d;
      --bay: #3a2416;
      --leather: #6a3d1c;
      --gold: #c9a227;
      --gold-lt: #f0d48a;
      --turf: #2a5a38;
      --turf-lt: #3e7a4e;
      --cream: #f4ead3;
      --paper: #fbf6ea;
      --ink: #1c140e;
      --muted: #6d5c4a;
      --line: #e2d3b6;
      --danger: #8a2f24;
      --font: 18px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--soil); color: var(--ink); font-family: Figtree, system-ui, sans-serif; font-size: var(--font); }
    button, input { font: inherit; }
    a { color: inherit; text-decoration: none; }
    .app {
      min-height: 100dvh;
      background:
        radial-gradient(900px 420px at 80% -10%, rgba(201,162,39,.18), transparent 50%),
        linear-gradient(180deg, #1b1610 0%, #14110d 40%, #102016 100%);
    }
    header.top {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      background: rgba(20,17,13,.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(201,162,39,.35);
      color: var(--cream);
    }
    .mark { display: flex; align-items: center; gap: 10px; }
    .silk {
      width: 36px; height: 36px; border-radius: 8px 8px 12px 12px;
      background: linear-gradient(135deg, #7a4a1e 40%, #c9a227 40% 60%, #2a5a38 60%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);
    }
    .brand b { display: block; font-family: "Instrument Serif", Georgia, serif; font-size: 22px; font-weight: 400; color: var(--gold-lt); line-height: 1; }
    .brand small { letter-spacing: .16em; text-transform: uppercase; font-size: 10px; color: #cbb896; }
    nav.tabs { display: flex; gap: 4px; background: #221c16; padding: 4px; border-radius: 999px; }
    nav.tabs a { color: #cbb896; padding: 8px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; }
    nav.tabs a.active { background: var(--gold); color: var(--soil); }
    main { max-width: 820px; margin: 0 auto; padding: 14px 14px 128px; }
    .hero {
      position: relative; overflow: hidden;
      background: linear-gradient(145deg, #2a1c12 0%, #17140f 55%, #1a2a1c 120%);
      color: var(--cream); border-radius: 22px; padding: 22px 20px 20px;
      border: 1px solid rgba(240,212,138,.22);
    }
    .hero:before {
      content: ""; position: absolute; right: -20px; bottom: -30px; width: 180px; height: 180px;
      background: radial-gradient(circle, rgba(201,162,39,.2), transparent 70%);
    }
    .kicker { color: var(--gold-lt); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; }
    .hero h1 { font-family: "Instrument Serif", Georgia, serif; font-size: 34px; font-weight: 400; margin: 8px 0 8px; line-height: 1.05; }
    .hero p { margin: 0; color: #e7d9bd; font-size: 17px; }
    .card {
      background: var(--paper); border: 1px solid var(--line); border-radius: 20px;
      padding: 16px; margin-top: 12px;
    }
    .card h2 { font-family: "Instrument Serif", Georgia, serif; font-size: 26px; font-weight: 400; margin: 0 0 6px; }
    .muted { color: var(--muted); }
    .race {
      display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center;
      padding: 14px 4px; border-bottom: 1px solid var(--line);
    }
    .race:last-child { border-bottom: 0; }
    .rn {
      width: 54px; height: 54px; border-radius: 16px;
      background: var(--soil); color: var(--gold-lt);
      display: grid; place-items: center; font-family: "Instrument Serif", Georgia, serif; font-size: 24px;
    }
    .rn.g1 { background: linear-gradient(160deg, #5a3a12, #14110d); box-shadow: inset 0 0 0 1px var(--gold); }
    .meta b { display: block; font-size: 17px; line-height: 1.2; }
    .meta .who { color: var(--muted); font-size: 14px; margin-top: 3px; }
    .btn {
      border: 0; border-radius: 999px; padding: 12px 16px; font-weight: 800; cursor: pointer;
    }
    .btn.gold { background: var(--gold); color: var(--soil); width: 100%; }
    .btn.soil { background: var(--soil); color: var(--gold-lt); white-space: nowrap; }
    .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid #d3c3a4; }
    .chip { display: inline-block; background: #efe3c8; color: #3c2a12; border-radius: 999px; padding: 4px 9px; font-size: 13px; font-weight: 800; }
    input[type=text], input[type=password] {
      width: 100%; padding: 14px; border-radius: 14px; border: 1px solid #d3c4aa; background: #fff; font-size: 18px;
    }

    /* one-horse yard mode */
    .yard { display: flex; flex-direction: column; gap: 12px; }
    .progress { display: flex; gap: 5px; flex-wrap: wrap; }
    .progress button {
      width: 34px; height: 34px; border-radius: 10px; border: 0; background: #e8dcc4; color: var(--ink); font-weight: 800; font-size: 13px;
    }
    .progress button.on { background: var(--soil); color: var(--gold-lt); }
    .progress button.done { background: var(--turf); color: #fff; }
    .horse-pane {
      background: var(--paper); border-radius: 24px; padding: 16px 16px 18px; border: 1px solid var(--line);
    }
    .hd { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .cloth {
      min-width: 56px; height: 56px; border-radius: 16px; background: var(--soil); color: var(--gold-lt);
      display: grid; place-items: center; font-family: "Instrument Serif", Georgia, serif; font-size: 28px;
    }
    .total-pill {
      min-width: 72px; text-align: right;
    }
    .total-pill b { display: block; font-family: "Instrument Serif", Georgia, serif; font-size: 36px; line-height: 1; color: var(--leather); }
    .total-pill span { color: var(--muted); font-size: 13px; font-weight: 700; }
    .crit { margin-top: 14px; }
    .lab { display: flex; justify-content: space-between; font-weight: 800; font-size: 16px; }
    .scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(44px, 1fr)); gap: 7px; margin-top: 7px; }
    .scores button {
      height: 46px; border-radius: 12px; border: 1px solid #d8c9ae; background: #fff; font-weight: 800; font-size: 17px;
    }
    .scores button.on { background: var(--soil); color: var(--gold-lt); border-color: var(--soil); }
    .dock {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      background: rgba(20,17,13,.96); color: var(--cream);
      padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
      display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center;
      border-top: 1px solid rgba(201,162,39,.35);
    }
    .dock .lead { font-family: "Instrument Serif", Georgia, serif; font-size: 18px; color: var(--gold-lt); line-height: 1.15; }
    .dock .btn { padding: 11px 14px; }
    .board-grid { display: grid; gap: 8px; }
    .brow {
      display: grid; grid-template-columns: 48px 1fr 64px; gap: 10px; align-items: center;
      background: var(--paper); border-radius: 16px; padding: 14px 16px;
    }
    .brow.hot { background: #fff1c4; }
    .brow .r { font-family: "Instrument Serif", Georgia, serif; font-size: 24px; }
    .toast { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); background: var(--turf); color: #fff; padding: 10px 16px; border-radius: 999px; z-index: 50; font-weight: 700; }
    .hidden { display: none !important; }
    @media (min-width: 800px) {
      .hero h1 { font-size: 42px; }
      .board-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="mark">
      <div class="silk" aria-hidden="true"></div>
      <div class="brand"><b>Yard Card</b><small>MPC · Caulfield</small></div>
    </div>
    <nav class="tabs">
      <a href="#/judge" data-nav="judge">Yard</a>
      <a href="#/board" data-nav="board">Board</a>
      <a href="#/host" data-nav="host">Host</a>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div id="toast" class="toast hidden"></div>
<script>
const CRITERIA = [
  { key: "build", label: "Balance & build", max: 20 },
  { key: "muscle", label: "Muscle & condition", max: 20 },
  { key: "grooming", label: "Grooming", max: 15 },
  { key: "legs", label: "Legs & feet", max: 10 },
  { key: "movement", label: "Movement", max: 10 },
  { key: "demeanour", label: "Demeanour", max: 10 },
  { key: "tack", label: "Tack", max: 5 },
  { key: "strapper", label: "Strapper", max: 10 },
];
const LS = "yardcard.party.v2";
const $ = (s, el=document) => el.querySelector(s);
const view = $("#view");
let raceCache = null;
let horseIndex = 0;
let activeRaceNo = null;
let activeParty = null;

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden");
  setTimeout(() => t.classList.add("hidden"), 1600);
}
function loadParty() { try { return JSON.parse(localStorage.getItem(LS) || "null"); } catch { return null; } }
function saveParty(p) { localStorage.setItem(LS, JSON.stringify(p)); }
function fmtTime(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleTimeString("en-AU", { hour: "numeric", minute: "2-digit", timeZone: "Australia/Melbourne" });
}
function groupTag(r) {
  const n = (r.name || "").toUpperCase();
  if (/UNDERWOOD|SIR RUPERT/.test(n)) return "GROUP 1";
  if (/PRELUDE|HOW NOW|NATURALISM/.test(n)) return "FEATURE";
  return r.nameForm || "";
}
async function api(path, opts) {
  const res = await fetch(path, { headers: { "content-type": "application/json" }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}
function navActive(name) {
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("active", a.dataset.nav === name));
}
function route() {
  const parts = (location.hash.replace("#", "") || "/judge").split("/").filter(Boolean);
  if (parts[0] === "board") return renderBoard();
  if (parts[0] === "host") return renderHost();
  if (parts[0] === "race" && parts[1]) return renderRace(Number(parts[1]));
  return renderJudgeHome();
}
function stepValues(max) {
  if (max <= 5) return [1,2,3,4,5];
  if (max === 10) return [5,6,7,8,9,10];
  if (max === 15) return [9,10,11,12,13,14,15];
  return [12,14,16,18,20];
}
function totalOf(marks) { return CRITERIA.reduce((s,c) => s + (Number(marks?.[c.key]) || 0), 0); }

async function renderJudgeHome() {
  navActive("judge");
  $("#dock")?.remove();
  localStorage.removeItem(LS);
  const state = await api("/api/state");
  view.innerHTML = `
    <section class="hero">
      <div class="kicker">Caulfield · 19 September 2026 · Skyline Suites</div>
      <h1>Best presented in the yard</h1>
      <p>All ten tables. Tap This is us on your race.</p>
    </section>
    <div class="card">
      <h2>Allocated tables</h2>
      <div id="races"></div>
    </div>`;
  $("#races").innerHTML = state.board.map(r => {
    const att = r.attachment;
    const g1 = groupTag(r) === "GROUP 1" ? " g1" : "";
    return `<div class="race">
      <div class="rn${g1}">${r.raceNumber}</div>
      <div class="meta">
        <div class="kicker">${groupTag(r)} · out ${r.leaveSuite || ""}</div>
        <b>${r.name}</b>
        <div class="who">${(att?.members || []).join(" · ")}</div>
      </div>
      <button class="btn soil" data-claim="${att?.partyId || ""}">This is us</button>
    </div>`;
  }).join("");
  document.querySelectorAll("[data-claim]").forEach(btn => {
    btn.onclick = () => {
      const att = Object.values(state.attachments).find(a => a.partyId === btn.dataset.claim);
      if (!att) return;
      saveParty({ id: att.partyId, team: att.team, members: att.members });
      location.hash = "#/race/" + att.raceNumber;
    };
  });
}

async function renderRace(n) {
  navActive("judge");
  activeParty = loadParty();
  raceCache = await api("/api/race/" + n);
  const live = raceCache.horses.filter(h => !h.scratched);
  live.forEach(h => {
    const existing = raceCache.scores[String(h.cloth)];
    h.marks = existing ? { ...existing.marks } : {};
    h.note = existing?.note || "";
  });
  raceCache.live = live;
  if (activeRaceNo !== n) { horseIndex = 0; activeRaceNo = n; }
  horseIndex = Math.min(horseIndex, Math.max(live.length - 1, 0));
  paintHorse();
}

function goHorse(delta) {
  horseIndex = Math.max(0, Math.min(raceCache.live.length - 1, horseIndex + delta));
  paintHorse();
}

function paintHorse() {
  const race = raceCache;
  const live = race.live;
  const h = live[horseIndex];
  if (!h) return;
  const scr = race.horses.filter(x => x.scratched);
  view.innerHTML = `
    <section class="hero">
      <div class="kicker">${groupTag(race)} · ${fmtTime(race.time)} · ${race.distance} · ${live.length} to judge</div>
      <h1>R${race.raceNumber} ${race.name}</h1>
      <p>Present as they walk to the start. ${(race.attachment?.members || []).join(" · ")}</p>
    </section>
    <div class="yard">
      <div class="progress">
        ${live.map((x,i) => `<button class="${i===horseIndex?"on":""} ${totalOf(x.marks)? "done":""}" data-i="${i}">${x.cloth}</button>`).join("")}
      </div>
      <div class="horse-pane" id="pane"></div>
      ${scr.length ? `<div class="muted" style="padding:0 6px">Scratched · ${scr.map(x => x.cloth + " " + x.name).join(" · ")}</div>` : ""}
      <button class="btn ghost" style="width:100%" id="back">Back to tables</button>
    </div>`;
  document.querySelectorAll(".progress [data-i]").forEach(b => b.onclick = () => { horseIndex = Number(b.dataset.i); paintHorse(); });
  $("#back").onclick = () => { location.hash = "#/judge"; };
  mountPane(h);
  mountDock();
}

function mountPane(h) {
  const pane = $("#pane");
  pane.innerHTML = `
    <div class="hd">
      <div style="display:flex;gap:12px">
        <div class="cloth">${h.cloth}</div>
        <div>
          <b style="font-size:22px">${h.name}</b>
          <div class="muted">J ${h.jockey || "—"}</div>
          <div class="muted">T ${h.trainer || "—"} · box ${h.barrier ?? "—"} · ${h.weight || ""}</div>
        </div>
      </div>
      <div class="total-pill"><b id="htot">${totalOf(h.marks)}</b><span>/ 100</span></div>
    </div>
    ${CRITERIA.map(c => `
      <div class="crit">
        <div class="lab"><span>${c.label}</span><span>/${c.max}</span></div>
        <div class="scores" data-key="${c.key}">
          ${stepValues(c.max).map(v => `<button data-v="${v}" class="${Number(h.marks[c.key])===v?"on":""}">${v}</button>`).join("")}
        </div>
      </div>`).join("")}`;
  pane.querySelectorAll(".scores button").forEach(b => {
    b.onclick = () => {
      const key = b.parentElement.dataset.key;
      h.marks[key] = Number(b.dataset.v);
      b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      $("#htot").textContent = totalOf(h.marks);
      persist(h);
      mountDock();
    };
  });
}

async function persist(h) {
  try {
    await api("/api/score", { method: "POST", body: JSON.stringify({
      raceNumber: raceCache.raceNumber, partyId: activeParty?.id, cloth: h.cloth, name: h.name, marks: h.marks, note: h.note || ""
    })});
  } catch (e) { toast(e.message || "Save failed"); }
}

function mountDock() {
  let dock = $("#dock");
  if (!dock) { dock = document.createElement("div"); dock.className = "dock"; dock.id = "dock"; document.body.appendChild(dock); }
  const live = raceCache.live;
  const ranked = live.filter(h => totalOf(h.marks) > 0).sort((a,b) => totalOf(b.marks) - totalOf(a.marks));
  const lead = ranked[0];
  const last = horseIndex >= live.length - 1;
  dock.innerHTML = `
    <button class="btn ghost" id="prev" style="color:#f4ead3;border-color:#6d5c4a">Prev</button>
    <div class="lead">${lead ? lead.cloth + " " + lead.name + " · " + totalOf(lead.marks) : ranked.length + " / " + live.length + " scored"}</div>
    <button class="btn gold" id="save" style="margin:0;width:auto">${last ? "Save" : "Next"}</button>`;
  $("#prev").onclick = () => goHorse(-1);
  $("#save").onclick = () => {
    const h = live[horseIndex];
    persist(h);
    toast(h.name + " · " + totalOf(h.marks));
    if (horseIndex < live.length - 1) goHorse(1);
  };
}

async function renderBoard() {
  navActive("board");
  $("#dock")?.remove();
  const state = await api("/api/state");
  view.innerHTML = `
    <section class="hero">
      <div class="kicker">Skyline Suites · live</div>
      <h1>Best presented</h1>
      <p>${state.meetingName}. Winners lock as each table finishes in the yard.</p>
    </section>
    <div class="board-grid">
      ${state.board.map(r => {
        const w = r.winner;
        return `<div class="brow ${w ? "hot" : ""}">
          <div class="r">${r.raceNumber}</div>
          <div>
            <b>${r.name}</b>
            <div class="muted">${w ? w.cloth + " " + w.name : "Still in the yard"} · ${fmtTime(r.time)}</div>
          </div>
          <div style="font-family:'Instrument Serif',Georgia,serif;font-size:30px;text-align:right">${w ? w.total : "—"}</div>
        </div>`;
      }).join("")}
    </div>`;
}

async function renderHost() {
  navActive("host");
  $("#dock")?.remove();
  if (sessionStorage.getItem("yard.host") !== "1") {
    view.innerHTML = `
      <section class="hero"><div class="kicker">Coordinator</div><h1>Host desk</h1><p>See which tables have left and which races have a winner.</p></section>
      <div class="card"><input id="pin" type="password" placeholder="Host PIN" /><button class="btn gold" id="login">Unlock</button></div>`;
    $("#login").onclick = async () => {
      try { await api("/api/host/login", { method:"POST", body: JSON.stringify({ pin: $("#pin").value }) }); sessionStorage.setItem("yard.host","1"); renderHost(); }
      catch(e) { toast(e.message); }
    };
    return;
  }
  const state = await api("/api/state");
  view.innerHTML = `
    <section class="hero"><div class="kicker">Host</div><h1>Tables and winners</h1><p>Leave-suite times are T-20. Present before they jump.</p></section>
    <div class="card">
      ${state.board.map(r => `
        <div class="race">
          <div class="rn${groupTag(r)==="GROUP 1"?" g1":""}">${r.raceNumber}</div>
          <div class="meta">
            <div class="kicker">leave ${r.leaveSuite || ""} · ${r.live} live / ${r.scratched} scr</div>
            <b>${r.name}</b>
            <div class="who">${(r.attachment?.members || []).join(" · ") || "No table"}</div>
          </div>
          <div>${r.winner ? `<span class="chip">${r.winner.cloth} ${r.winner.name} ${r.winner.total}</span>` : `<span class="muted">${r.scoredCount} scored</span>`}</div>
        </div>`).join("")}
    </div>`;
}

window.addEventListener("hashchange", route);
route();
setInterval(() => {
  if (/board|host/.test(location.hash)) route();
}, 8000);
</script>
</body>
</html>
